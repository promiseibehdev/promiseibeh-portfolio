name: Weekly SEO Health Check

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-seo-health
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Check TypeScript
        id: typescript
        continue-on-error: true
        run: npm run lint

      - name: Build production website
        id: build
        continue-on-error: true
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install browser audit dependency
        run: python -m pip install --disable-pip-version-check selenium==4.34.2

      - name: Audit live SEO health
        id: seo_audit
        continue-on-error: true
        run: python scripts/weekly_seo_health_check.py

      - name: Create or update failure issue
        if: ${{ steps.typescript.outcome == 'failure' || steps.build.outcome == 'failure' || steps.seo_audit.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TYPESCRIPT_STATUS: ${{ steps.typescript.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          SEO_STATUS: ${{ steps.seo_audit.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create seo-health-check --color D73A4A --description "Automated weekly SEO health failure" --force
          report_file=$(mktemp)
          {
            echo "# Weekly SEO health check failed"
            echo
            echo "- TypeScript: $TYPESCRIPT_STATUS"
            echo "- Production build: $BUILD_STATUS"
            echo "- Live SEO audit: $SEO_STATUS"
            echo "- [Workflow run]($RUN_URL)"
            echo
            if [[ -f seo-health-report.md ]]; then
              cat seo-health-report.md
            else
              echo "The live audit did not produce a report. Review the workflow log."
            fi
          } > "$report_file"
          issue_number=$(gh issue list --state open --label seo-health-check --json number --jq '.[0].number')
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body-file "$report_file"
          else
            gh issue create --title "Weekly SEO health check failure" --label seo-health-check --body-file "$report_file"
          fi

      - name: Fail workflow when a check failed
        if: ${{ steps.typescript.outcome == 'failure' || steps.build.outcome == 'failure' || steps.seo_audit.outcome == 'failure' }}
        run: exit 1
